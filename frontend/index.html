<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión · Centinela Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body class="auth">
<main class="auth-card">
  <span class="logo"><img src="assets/logo.png" alt="Centinela Digital" onerror="this.style.display='none'"></span>
  <h1>Iniciar sesión</h1>
  <form id="form-login" novalidate>
    <div class="field"><label for="correo">Correo electrónico</label><input id="correo" name="correo" type="email" autocomplete="email" required></div>
    <div class="field"><label for="password">Contraseña</label>
      <div class="pw"><input id="password" name="password" type="password" autocomplete="current-password" required><button type="button" aria-label="Mostrar u ocultar contraseña">Mostrar</button></div></div>
    <p class="linkrow"><a href="#">¿Olvidaste tu contraseña?</a></p>
    <button class="btn block" type="submit">Iniciar sesión</button>
    <p class="msg" role="status"></p>
    <a class="btn ghost block" href="registro.html">Registrarse</a>
  </form>
</main>
<script src="js/script.js"></script>
</body>
</html>
