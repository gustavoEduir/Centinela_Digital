<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registrarse · Centinela Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body class="auth">
<main class="auth-card">
  <span class="logo"><img src="assets/logo.png" alt="Centinela Digital" onerror="this.style.display='none'"></span>
  <h1>Registrarse</h1>
  <form id="form-registro" novalidate>
    <div class="field"><label for="correo">Correo electrónico</label><input id="correo" name="correo" type="email" autocomplete="email" required></div>
    <div class="field"><label for="password">Crear contraseña</label>
      <div class="pw"><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required><button type="button" aria-label="Mostrar u ocultar contraseña">Mostrar</button></div></div>
    <div class="field"><label for="telefono">Número telefónico</label><input id="telefono" name="telefono" type="tel" autocomplete="tel" required></div>
    <div class="field"><label for="nombres">Nombre(s)</label><input id="nombres" name="nombres" autocomplete="given-name" required></div>
    <div class="field"><label for="apellidos">Apellidos</label><input id="apellidos" name="apellidos" autocomplete="family-name" required></div>
    <button class="btn block" type="submit">Crear cuenta</button>
    <p class="msg" role="status"></p>
    <a class="btn ghost block" href="index.html">Ya tengo cuenta</a>
  </form>
</main>
<script src="js/script.js"></script>
</body>
</html>
